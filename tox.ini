[tox]
envlist = black, compileall

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

# No test suite and no mypy: default.py is one file whose every statement calls
# into Kodi or the filesystem, and the interesting behaviour (segment ordering,
# ffmpeg remux) is only observable against real timeshift output. A syntax gate
# plus black is the honest ceiling outside a running Kodi.
[testenv:compileall]
commands = python -m compileall -q default.py tools/
