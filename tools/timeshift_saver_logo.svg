<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">

  <!-- Background -->
  <rect width="256" height="256" fill="#1a1a1a"/>

  <!-- Floppy disk outer body -->
  <rect x="32" y="24" width="192" height="208" rx="16" ry="16"
        fill="none" stroke="#cccccc" stroke-width="7"/>

  <!-- Write-protect notch (top-right corner cut) -->
  <polygon points="178,24 224,24 224,70" fill="#1a1a1a"/>
  <polyline points="178,24 224,70" fill="none" stroke="#cccccc" stroke-width="7" stroke-linejoin="round"/>

  <!-- Disk slot (top label window) -->
  <rect x="64" y="38" width="96" height="62" rx="5" ry="5"
        fill="none" stroke="#cccccc" stroke-width="5"/>
  <!-- Slot lines suggesting magnetic disk -->
  <line x1="76" y1="54" x2="148" y2="54" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="76" y1="66" x2="148" y2="66" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="76" y1="78" x2="120" y2="78" stroke="#cccccc" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Label area divider line -->
  <line x1="32" y1="118" x2="224" y2="118" stroke="#cccccc" stroke-width="4" opacity="0.4"/>

  <!-- CLOCK (left side of label area) -->
  <circle cx="94" cy="175" r="40" fill="none" stroke="#cccccc" stroke-width="6"/>

  <!-- Clock tick marks at 12, 3, 6, 9 -->
  <line x1="94" y1="139" x2="94" y2="148" stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="175" x2="121" y2="175" stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
  <line x1="94" y1="211" x2="94" y2="202" stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="175" x2="67" y2="175"  stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>

  <!-- Hour hand (~10 o'clock) -->
  <line x1="94" y1="175" x2="76" y2="158" stroke="#cccccc" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand (~12 o'clock) -->
  <line x1="94" y1="175" x2="94" y2="149" stroke="#cccccc" stroke-width="4" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="94" cy="175" r="4" fill="#cccccc"/>

  <!-- Divider between clock and shift key -->
  <line x1="148" y1="126" x2="148" y2="222" stroke="#cccccc" stroke-width="3" opacity="0.35"/>

  <!-- SHIFT KEY (right side of label area) -->
  <!-- Keycap outline -->
  <rect x="156" y="148" width="56" height="48" rx="8" ry="8"
        fill="none" stroke="#cccccc" stroke-width="5"/>

  <!-- Shift arrow - upward pointing -->
  <polygon points="184,152 164,172 204,172" fill="#cccccc"/>
  <!-- Arrow shaft -->
  <rect x="176" y="172" width="16" height="14" rx="2" fill="#cccccc"/>

</svg>
